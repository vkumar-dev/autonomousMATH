name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'articles/**'
      - 'index.html'
      - 'articles-list.html'
      - 'view-article.html'
      - 'styles/**'
      - 'scripts/**'
  workflow_run:
    workflows:
      - Autonomous Math Question (HF GGUF)
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    # A GITHUB_TOKEN push from the generator does not recursively trigger a
    # push workflow. Deploy explicitly after a successful generator run.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      
      - name: Install dependencies
        run: |
          npm init -y
          npm install gray-matter --save
      
      - name: Build article index
        run: node scripts/build-article-index.js

      - name: Build content cache
        run: node scripts/build-articles-content.js
      
      - name: Setup Pages
        uses: actions/configure-pages@v6
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
