<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All questions — autonomousMATH</title>
  <meta name="description" content="Every question posed by autonomousMATH, newest first">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles/homepage.css">
  <link rel="stylesheet" href="styles/theme-white.css">
  <link rel="stylesheet" href="styles/theme-black.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
</head>
<body class="theme-loading">
  <div id="app">
    <header class="topbar">
      <div class="topbar-inner">
        <a class="topbar-brand" href="index.html">
          <span class="logo-icon" aria-hidden="true">π</span>
          <span class="topbar-brand-text">
            <span class="brand-name">autonomousMATH</span>
            <span class="brand-tag">A question a day, posed at π-time</span>
          </span>
        </a>
        <div class="topbar-meta">
          <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle light and dark mode">🌙 Dark</button>
        </div>
      </div>
    </header>

    <main class="articles-list-view">
      <h1>All questions</h1>
      <a href="index.html" class="back-link">← Back to the notebook</a>
      <div id="articles-list-container">
        <div class="loading-state">
          <div class="loading-spinner"></div>
          <p>Gathering the archive…</p>
        </div>
      </div>
    </main>

    <footer class="footer">
      <p>
        <a href="index.html">The notebook</a>
        <span class="separator">•</span>
        <a href="https://github.com/vkumar-dev/autonomousMATH" target="_blank" rel="noopener noreferrer">Source</a>
        <span class="separator">•</span>
        <a href="#" id="refresh-theme">Toggle theme</a>
        <span class="separator">•</span>
        <span class="pi-note">New entry daily at 6:41 PM IST</span>
      </p>
    </footer>
  </div>

  <script src="scripts/theme-manager.js"></script>
  <script>
    class ArticlesList {
      constructor() {
        this.container = document.getElementById('articles-list-container');
        this.init();
      }

      async init() {
        try {
          const bustParam = `?t=${window.CACHE_BUST || Date.now()}`;
          const response = await fetch('articles-index.json' + bustParam);
          if (!response.ok) throw new Error('Failed to load articles');
          const data = await response.json();
          const articles = (data.articles || [])
            .filter((a) => a && a.path)
            .sort((a, b) => new Date(b.date).getTime() - new Date(a.date).getTime());
          this.render(articles);
        } catch (error) {
          console.error('Failed to load articles:', error);
          if (this.container) {
            this.container.innerHTML = '<p style="color: var(--text-tertiary);">Error loading questions.</p>';
          }
        }
      }

      render(articles) {
        if (!this.container) return;

        if (!articles.length) {
          this.container.innerHTML = '<div class="empty-state"><div class="empty-state-icon">π</div><p>The first question arrives today at 6:41 PM IST.</p></div>';
          return;
        }

        const html = `
          <ol>
            ${articles.map((article) => `
              <li>
                <a href="view-article.html?article=${encodeURIComponent(article.path)}">
                  ${this.formatDate(article.date)}
                  <span class="article-title">${this.escapeHtml(article.question || article.title)}</span>
                </a>
              </li>
            `).join('')}
          </ol>
        `;
        this.container.innerHTML = html;
      }

      formatDate(dateString) {
        const date = new Date(dateString);
        return `<time datetime="${date.toISOString()}">${date.toLocaleDateString('en-US', {
          year: 'numeric',
          month: 'short',
          day: 'numeric'
        })}</time>`;
      }

      escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      new ArticlesList();
    });
  </script>
</body>
</html>
